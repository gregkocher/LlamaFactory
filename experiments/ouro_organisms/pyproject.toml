[project]
name = "ouro-organism-experiments"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "llamafactory",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "torchaudio==2.8.0",
  "transformers==4.57.6",
  "peft==0.18.1",
  "trl==0.24.0",
  "accelerate==1.11.0",
  "zstandard==0.23.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
llamafactory = { path = "../..", editable = true }
